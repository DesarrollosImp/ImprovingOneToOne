<div class="container">
    <div class="surface-card p-4 shadow-2 border-round w-full lg:w-6">
        <div class="text-center mb-5">
            <img src="assets/images/improving.png" alt="Image" height="50" class="mb-3">
            <div class="text-900 text-3xl font-medium mb-3">Bienvenido de nuevo</div>
        </div>
        <div>
        <form>
            <label for="email1" class="block text-900 font-medium mb-2">Usuario / Mail</label>
            <input id="email1" type="text" placeholder="Correo electrónico" pInputText class="w-full mb-3" formControlName="email">

            <label for="password1" class="block text-900 font-medium mb-2">Contraseña</label>
            <input id="password1" type="password" placeholder="Contraseña" pInputText class="w-full mb-3" formControlName="password">
            <button pButton pRipple label="Iniciar sesión" icon="pi pi-user" class="w-full p-button-primary"></button><!--[disabled]="formGroup.invalid"-->
        </form>
        </div>
    </div>
</div>
